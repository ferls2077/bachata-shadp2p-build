name: Build OptiScaler PR42 Push

on:
  push:
    branches:
      - optiscaler-pr42-build

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout PR42 source
        shell: pwsh
        run: |
          git clone https://github.com/cmh1448/OptiScaler_DLSSNR.git src
          git -C src checkout fa78de5c23077e3481708245bd6cda819c5f264c
          git -C src submodule update --init --recursive
          git -C src rev-parse HEAD

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build DLSS NR forwarder
        shell: pwsh
        run: msbuild src\OptiScaler\dlssnr\forwarder\dlssnr_forwarder.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Build OptiScaler Release x64
        shell: pwsh
        run: msbuild src\OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Package official release layout
        shell: pwsh
        run: |
          Set-Location src
          ./package_release.ps1 -Version "pr42-fa78de5" -SkipBuild
          Get-Item .\release\OptiScaler-DLSSNR-pr42-fa78de5.zip | Select-Object FullName,Length

      - name: Upload ready-to-use package
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-DLSSNR-PR42-fa78de5
          path: src/release/OptiScaler-DLSSNR-pr42-fa78de5.zip
          if-no-files-found: error
          retention-days: 7
