name: Build OptiScaler PR42 Push

on:
  push:
    branches:
      - optiscaler-pr42-build

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout PR42 source
        shell: pwsh
        run: |
          git clone --recursive https://github.com/cmh1448/OptiScaler_DLSSNR.git src
          git -C src checkout fa78de5c23077e3481708245bd6cda819c5f264c
          git -C src submodule update --init --recursive

      - name: Configure
        shell: pwsh
        run: cmake -S src -B src/build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        shell: pwsh
        run: cmake --build src/build --config Release --parallel

      - name: Package release
        shell: pwsh
        run: |
          Set-Location src
          if (Test-Path ./package_release.ps1) {
            ./package_release.ps1
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-PR42-fa78de5
          path: |
            src/**/*.zip
            src/build/**/Release/*.dll
            src/build/**/Release/*.exe
          if-no-files-found: error
          retention-days: 7
